<title>Netty Allocators Benchmark</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex;
  height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  color: #e2e8f0;
}

nav {
  width: 200px;
  flex-shrink: 0;
  border-right: 1px solid #252830;
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  gap: 4px;
}

.logo {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #16191f;
  padding: 0 4px 16px;
  border-bottom: 1px solid #252830;
  margin-bottom: 8px;
}

.logo span {
  display: block;
  font-size: 12px;
  font-weight: 450;
  letter-spacing: 0.05em;
  color: #475569;
  margin-top: 16px;
}

.nav-btn {
  background: transparent;
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
  text-align: left;
  font-size: 16px;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  line-height: 1.4;
}

.nav-btn:hover {
  background: #1e2230;
  color: #cbd5e1;
}

.nav-btn.active {
  background: #1e2a40;
  color: #ffffff;
}

.nav-btn::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  margin-right: 8px;
  opacity: 0.6;
  vertical-align: middle;
  position: relative;
  top: -1px;
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: #ffffff;
}

iframe {
  width: 100%;
  flex: 1;
  border: none;
}

#loading {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(3px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 14px;
  font-size: 13px;
  color: #64748b;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #e2e8f0;
  border-top-color: #3b82f6;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

</nav>

const AL=["POOLED","ADAPTIVE","MIMALLOC"];
const CLR={"POOLED":"#4a7fcb","ADAPTIVE":"#2aaa6e","MIMALLOC":"#d05a2a"};
let st={method:"direct",pattern:"SOCKET_PROXY",rw:"true"};
let cL,cR,cNew;

function rows(){return D.filter(r=>r[0]===st.method&&r[3]===st.rw&&r[4]===st.pattern);}
function ds(col){
  return AL.map(a=>{
    const sub=rows().filter(r=>r[2]===a);
    return{label:a,data:BUFS.map(b=>{const r=sub.find(x=>x[1]===b);return r?r[col]:null;}),
      borderColor:CLR[a],backgroundColor:CLR[a]+"22",borderWidth:2,
    };
  });
}
function opts(ytitle){
  return{responsive:true,maintainAspectRatio:false,animation:{duration:300},
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y!=null?Math.round(c.parsed.y):"n/a"}`}}},
    scales:{x:{grid:{color:"rgba(128,128,128,.12)"},ticks:{font:{size:11}},title:{display:true,text:"Live buffers",font:{size:11}}},
            y:{grid:{color:"rgba(128,128,128,.12)"},ticks:{font:{size:11}},title:{display:true,text:ytitle,font:{size:11}}}}};
}
function draw(){
  const lData={labels:BUFS.map(String),datasets:ds(5)};
  const rData={labels:BUFS.map(String),datasets:ds(6)};
  const nData={labels:BUFS.map(String),datasets:ds(7)};
  if(cL){cL.data=lData;cL.update();}
  if(cR){cR.data=rData;cR.update();}
  if(cNew){cNew.data=nData;cNew.update();} 
}

document.querySelectorAll(".pg").forEach(g=>{
  g.addEventListener("click",e=>{
    const b=e.target.closest(".pill");if(!b)return;
    g.querySelectorAll(".pill").forEach(p=>p.classList.remove("on"));
    b.classList.add("on");
    const id=g.id;
    if(id==="gm")st.method=b.dataset.v;
    if(id==="gp")st.pattern=b.dataset.v;
    if(id==="gr")st.rw=b.dataset.v;
    draw();
  });
});

function loadChartJS(cb){
  const CDNS=[
    "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
  ];
  let done=false;
  CDNS.forEach(url=>{
    const s=document.createElement("script");
    s.src=url;
    s.onload=()=>{ if(!done){ done=true; cb(); } };
    document.head.appendChild(s);
  });
}

      data: { labels: BUFS.map(String), datasets: ds(7) },
      options: opts("MiB")
    });

  if (window.parent) parent.postMessage("charts-ready", "*");
});

const BUFS=[128,1024,4096,8192,16384,32768,65536];
const AL=["POOLED","ADAPTIVE","MIMALLOC"];
const CLR={"POOLED":"#4a7fcb","ADAPTIVE":"#2aaa6e","MIMALLOC":"#d05a2a"};
let st={method:"direct",pattern:"SOCKET_PROXY",rw:"true"};
let cL,cR;

function rows(){return D.filter(r=>r[0]===st.method&&r[3]===st.rw&&r[4]===st.pattern);}
function ds(col){
  return AL.map(a=>{
    const sub=rows().filter(r=>r[2]===a);
    return{label:a,data:BUFS.map(b=>{const r=sub.find(x=>x[1]===b);return r?r[col]:null;}),
      borderColor:CLR[a],backgroundColor:CLR[a]+"22",borderWidth:2,
    };
  });
}
function opts(ytitle){
  return{responsive:true,maintainAspectRatio:false,animation:{duration:300},
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y!=null?Math.round(c.parsed.y):"n/a"}`}}},
    scales:{x:{grid:{color:"rgba(128,128,128,.12)"},ticks:{font:{size:11}},title:{display:true,text:"Live buffers",font:{size:11}}},
            y:{grid:{color:"rgba(128,128,128,.12)"},ticks:{font:{size:11}},title:{display:true,text:ytitle,font:{size:11}}}}};
}
function draw(){
  const lData={labels:BUFS.map(String),datasets:ds(5)};
  const rData={labels:BUFS.map(String),datasets:ds(6)};
  const nData={labels:BUFS.map(String),datasets:ds(7)};
  if(cL){cL.data=lData;cL.update();}
  if(cR){cR.data=rData;cR.update();}
  if (cNew) { cNew.data = nData; cNew.update(); }
}

document.querySelectorAll(".pg").forEach(g=>{
  g.addEventListener("click",e=>{
    const b=e.target.closest(".pill");if(!b)return;
    g.querySelectorAll(".pill").forEach(p=>p.classList.remove("on"));
    b.classList.add("on");
    const id=g.id;
    if(id==="gm")st.method=b.dataset.v;
    if(id==="gp")st.pattern=b.dataset.v;
    if(id==="gr")st.rw=b.dataset.v;
    draw();
  });
});

function loadChartJS(cb){
  const CDNS=[
    "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
  ];
  let done=false;
  CDNS.forEach(url=>{
    const s=document.createElement("script");
    s.src=url;
    s.onload=()=>{ if(!done){ done=true; cb(); } };
    document.head.appendChild(s);
  });
}
loadChartJS(function(){
  cL=new Chart(document.getElementById("cL"),{type:"line",data:{labels:BUFS.map(String),datasets:ds(5)},options:opts("ns/op")});
  cR=new Chart(document.getElementById("cR"),{type:"line",data:{labels:BUFS.map(String),datasets:ds(6)},options:opts("MiB")});
  cNew = new Chart(document.getElementById("cNew"), {
      type: "line",
      data: { labels: BUFS.map(String), datasets: ds(7) },
      options: opts("MiB")
    });

  if (window.parent) parent.postMessage("charts-ready", "*");
});
