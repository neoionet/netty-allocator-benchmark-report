<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex;
  height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  color: #e2e8f0;
}

nav {
  width: 200px;
  flex-shrink: 0;
  border-right: 1px solid #252830;
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  gap: 4px;
}

.logo {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #16191f;
  padding: 0 4px 16px;
  border-bottom: 1px solid #252830;
  margin-bottom: 8px;
}

.logo span {
  display: block;
  font-size: 12px;
  font-weight: 450;
  letter-spacing: 0.05em;
  color: #475569;
  margin-top: 16px;
}

.nav-btn {
  background: transparent;
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
  text-align: left;
  font-size: 16px;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  line-height: 1.4;
}

.nav-btn:hover {
  background: #1e2230;
  color: #cbd5e1;
}

.nav-btn.active {
  background: #1e2a40;
  color: #ffffff;
}

.nav-btn::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  margin-right: 8px;
  opacity: 0.6;
  vertical-align: middle;
  position: relative;
  top: -1px;
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: #ffffff;
}

iframe {
  width: 100%;
  flex: 1;
  border: none;
}

#loading {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(3px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 14px;
  font-size: 13px;
  color: #64748b;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #e2e8f0;
  border-top-color: #3b82f6;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<script>
const btns = document.querySelectorAll(".nav-btn");
const frames = document.querySelectorAll("iframe");

function show(btn, i) {
  btns.forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  frames.forEach((f, j) => {
    if (j === i) {
      if (!f.srcdoc) f.srcdoc = f.dataset.srcdoc;
      f.style.display = "block";
    } else {
      f.style.display = "none";
    }
  });
}

window.addEventListener('message', e => {
  if (e.data === 'charts-ready') {
    const el = document.getElementById('loading');
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(() => el.remove(), 300);
  }
});

// click first button on laod.
btns[0].click();
</script>
